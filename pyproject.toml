[project]
name = "redisql"
version = "0.1.0"
description = "In-memory sqlite replicated through Redis snapshots and pubsub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["redis>=8"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
